[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grok-a2a"
version = "0.1.0"
description = "Unofficial A2A (Agent2Agent) wrapper for xAI Grok — community adapter, not affiliated with xAI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Estes Advisory" }]
keywords = ["a2a", "agent2agent", "grok", "xai", "agents"]
dependencies = [
  "a2a-sdk[http-server]>=1.0.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/estesadvisory/grok-a2a"
Issues = "https://github.com/estesadvisory/grok-a2a/issues"
A2A = "https://a2a-protocol.org/latest/"
xAI = "https://docs.x.ai/"

[project.scripts]
grok-a2a = "grok_a2a.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_a2a"]

[tool.hatch.build.targets.sdist]
include = ["src/grok_a2a", "README.md", "LICENSE", ".env.example"]
